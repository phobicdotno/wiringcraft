name: Something is broken
description: An error, a crash, or a wrong result. It goes on the todo list and is fixed in turn.
labels: [todo, bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead (an error message, a wrong drawing, a crash).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, a command, or a small project that shows it. Leave out customer data.
  - type: input
    id: version
    attributes:
      label: Version and system
      description: WiringCraft version and operating system, e.g. 0.1.0 on Windows 11.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Paste a screenshot of WiringCraft here (Ctrl+V, or Cmd+V on a Mac), or drag picture files in. Leave out anything private.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How anyone can check it is fixed. Leave empty and the person who fixes it writes a test.
