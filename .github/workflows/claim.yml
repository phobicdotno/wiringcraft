# Todo claims: `/claim`, `/renew`, `/unclaim` on issues, pull requests that name an issue, and a
# sweep every 10 minutes that frees expired locks and answers commands a dropped run left waiting.
# The logic and its rules are in .github/scripts/claim.js (tested in CI); CONTRIBUTING.md explains
# the workflow. Actions are pinned to commit SHAs (the job can write to issues).
name: Claim

on:
  issue_comment:
    types: [created]
  # pull_request_target runs main's claim.js and only reads the PR's title, body and branch name;
  # the PR's code is never checked out.
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # To list open pull requests and to post the bot's notes on them ("add an Agent: line", "#N is
  # locked by ..."). Safe with pull_request_target here: the checkout below takes only
  # .github/scripts from the base branch, and no step checks out or runs a pull request's code.
  # Keep it that way if this job ever changes.
  pull-requests: write

# One queue for every run in the repository: commands, pull requests and the sweep can all change
# the same issue, so they never run at the same time. GitHub keeps only one waiting run and cancels
# older waiting ones; each run therefore starts by answering every command still without a reply.
concurrency:
  group: claim
  cancel-in-progress: false

jobs:
  claim:
    name: Claim bot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/renew') ||
      startsWith(github.event.comment.body, '/unclaim')))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const claim = require('./.github/scripts/claim.js');
            // Every run answers waiting commands and reconciles all open pull requests, whatever
            // event started it, so a run GitHub cancelled in the queue leaves nothing undone.
            core.info(`Answered: ${(await claim.backlog({ github, context })).join(' | ') || 'none'}`);
            core.info(`Pull requests: ${(await claim.pulls({ github, context })).join(', ') || 'none name an issue'}`);
            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              core.info(`Released: ${(await claim.sweep({ github, context })).join(', ') || 'none'}`);
            }
