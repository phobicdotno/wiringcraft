# Release builds to download and try: the app (`wiringcraft-app`) and the command line
# (`wiringcraft`) for Windows, Linux and macOS, as one zip per system on the run's page under
# "Artifacts". Runs on every push to main and on demand (Actions > Build > Run workflow), also for
# a pull request's branch. Installers are the next step (#47).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, exe: .exe }
          - { os: ubuntu-latest, name: linux-x64, exe: '' }
          - { os: macos-latest, name: macos-arm64, exe: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release
      - run: cargo build --release -p wc-cli -p wc-app
      - name: Collect
        shell: bash
        run: |
          d="wiringcraft-${{ matrix.name }}"
          mkdir -p "$d"
          cp "target/release/wiringcraft${{ matrix.exe }}" "target/release/wiringcraft-app${{ matrix.exe }}" "$d/"
          cp README.md LICENSE-MIT LICENSE-APACHE DISCLAIMER.md "$d/"
          "$d/wiringcraft${{ matrix.exe }}" --version || "$d/wiringcraft${{ matrix.exe }}" --help > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiringcraft-${{ matrix.name }}
          path: wiringcraft-${{ matrix.name }}
          retention-days: 30
