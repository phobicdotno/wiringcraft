[package]
# Windows icon resource, shared with the other program (see the script).
build = "../../packaging/windows/icon_build.rs"
name = "wc-app"
description = "WiringCraft desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wiringcraft-app"
path = "src/main.rs"

[dependencies]
wc-core.workspace = true
wc-library.workspace = true
wc-vcs.workspace = true
wc-pdf.workspace = true
wc-report.workspace = true
wc-agent.workspace = true
serde_json.workspace = true
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts", "x11", "wayland"] }
# eframe turns off wgpu's default backends; Direct3D 12 (with the WARP software adapter on a
# machine without a GPU) and Metal are needed where OpenGL 2+ is missing (see main.rs).
wgpu = { version = "24", default-features = false, features = ["dx12", "metal"] }
serde.workspace = true
toml.workspace = true
image.workspace = true
arboard.workspace = true
base64.workspace = true
# Native open/save dialogs (Windows, macOS, and the desktop portal on Linux).
rfd = "0.15"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"
