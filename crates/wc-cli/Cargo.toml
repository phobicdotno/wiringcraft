[package]
# Windows icon resource, shared with the other program (see the script).
build = "../../packaging/windows/icon_build.rs"
name = "wc-cli"
description = "WiringCraft command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wiringcraft"
path = "src/main.rs"

[dependencies]
wc-core.workspace = true
wc-library.workspace = true
wc-import.workspace = true
wc-pdf.workspace = true
wc-vcs.workspace = true
wc-report.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
# A private, unique folder for archive entries on their way to the single-file importers.
tempfile.workspace = true

[dev-dependencies]
# Tests write an EDZ archive.
sevenz-rust2 = { workspace = true, features = ["compress"] }
# Tests write a SolidWorks Electrical archive with library databases.
rusqlite.workspace = true
zip.workspace = true
# Tests write a logo picture.
image.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"
