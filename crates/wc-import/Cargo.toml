[package]
name = "wc-import"
description = "WiringCraft importers: DXF, SVG, CSV, EPLAN, AutomationML, KiCad, QElectroTech, BMEcat, SolidWorks Electrical, WAGO configurator lists"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wc-core.workspace = true
quick-xml.workspace = true
miniz_oxide.workspace = true
zip.workspace = true
image.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
sevenz-rust2.workspace = true
# The WAGO configurator list back matches its rows to the export's, and its articles to the
# project's and libraries' parts.
wc-report.workspace = true
wc-library.workspace = true
# Scanned PDF pictures: CCITT fax, JBIG2 and JPEG 2000 (pure Rust, MIT OR Apache-2.0).
hayro-ccitt.workspace = true
hayro-jbig2.workspace = true
hayro-jpeg2000.workspace = true

[dev-dependencies]
# Tests write 7-Zip archives.
sevenz-rust2 = { workspace = true, features = ["compress"] }
tempfile.workspace = true

[lints]
workspace = true
