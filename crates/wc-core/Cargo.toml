[package]
name = "wc-core"
description = "WiringCraft data model and text-based project files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Writing an output file relative to its opened folder (`openat`, `renameat`; `guard`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# File identity (volume serial and file index) for telling a hard link to a project file apart, and
# output files made and renamed relative to an opened folder (`guard`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
