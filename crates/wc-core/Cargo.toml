[package]
name = "wc-core"
description = "WiringCraft data model and text-based project files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Opening an output file without following a link at it (`guard`, #458).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# File identity (volume serial and file index) and opening a link as itself (`guard`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
