[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wc-core = { path = "crates/wc-core" }
wc-library = { path = "crates/wc-library" }
wc-import = { path = "crates/wc-import" }
wc-pdf = { path = "crates/wc-pdf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
