[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wc-core = { path = "crates/wc-core" }
wc-library = { path = "crates/wc-library" }
wc-import = { path = "crates/wc-import" }
wc-pdf = { path = "crates/wc-pdf" }
wc-vcs = { path = "crates/wc-vcs" }
wc-report = { path = "crates/wc-report" }
wc-agent = { path = "crates/wc-agent" }
wc-share = { path = "crates/wc-share" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
tempfile = "3"
miniz_oxide = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
hayro-ccitt = { version = "0.5", default-features = false }
hayro-jbig2 = { version = "0.4", default-features = false }
hayro-jpeg2000 = { version = "0.5", default-features = false }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
