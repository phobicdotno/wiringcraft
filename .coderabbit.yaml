# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Automatic review of every pull request (CodeRabbit GitHub app). Comment `@coderabbitai review`
# on a pull request to ask for another pass.
language: en-US
reviews:
  profile: chill
  poem: false
  sequence_diagrams: false
  in_progress_fortune: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
  path_instructions:
    - path: "crates/**"
      instructions: |
        Project rules (README.md, "Rules"):
        - Original work only: flag code, symbols, icons, templates or branding that look copied from
          another product.
        - No panics on user input: flag `unwrap`, `expect`, `panic!`, `unreachable!` and unchecked
          indexing outside tests. Errors carry their reason; flag error paths that drop it.
        Also flag: logic duplicated from elsewhere in the workspace, a fix that hides a symptom
        instead of removing its cause, and a behaviour change without a test that fails without it.
        A change to what a user already relies on (a default, a shortcut, what a tool does when used
        the usual way) must say so in the pull request description.
    - path: "crates/wc-core/**"
      instructions: |
        The document model. A change to a saved type must still load projects saved by the previous
        version; flag a renamed, removed or retyped serialized field without a migration and a test.
    - path: ".github/**"
      instructions: |
        Workflows: flag `pull_request_target` jobs that check out or run the pull request's code, and
        permissions wider than the job needs.
